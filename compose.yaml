name: ${COMPOSE_PROJECT_NAME:-repairdesk-sim}

services:
  app:
    build: .
    image: repairdesk-app:${COMPOSE_PROJECT_NAME:-repairdesk-sim}
    env_file: .env
    environment:
      DATABASE_PATH: /data/repairdesk.sqlite
      VERIFICATION_POLICY_PATH: /app/config/verification.yaml
      # Evidence bundles land on the durable volume (/data is repairdesk-owned)
      EVIDENCE_EXPORT_DIR: /data/evidence
      STATIC_DIR: /app/frontend/dist
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-data:/data
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    image: repairdesk-test:${COMPOSE_PROJECT_NAME:-repairdesk-sim}
    env_file: .env
    environment:
      APP_MODE: simulation
      DATABASE_PATH: /tmp/repairdesk-test.sqlite
      VERIFICATION_POLICY_PATH: /app/config/verification.yaml
    volumes: []
    # No ports, no mounted app data: tests run against an isolated test DB.
    command: ["bash", "scripts/test.sh"]

volumes:
  app-data:
